[package]
name = "laserhop"
version = "0.1.0"
edition = "2024"
description = "Share a USB GRBL laser and its camera over the network"
license = "MIT"
repository = "https://github.com/bostrot/laserhop"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
libc = "0.2.191"
linuxvideo = "0.3"
mdns-sd = "0.21.7"
nix = { version = "0.31", features = ["term"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
